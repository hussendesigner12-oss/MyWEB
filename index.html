*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);background:var(--cream);line-height:1.8}
a{color:inherit;text-decoration:none}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
svg.i{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.logo{display:block;background:var(--logo) center/contain no-repeat;aspect-ratio:286/380}

/* HERO */
.hero{position:relative;color:#fff;min-height:620px;padding-bottom:150px;overflow:hidden;
  background:
   linear-gradient(180deg,rgba(16,27,48,.35),rgba(16,27,48,.92)),
   radial-gradient(700px 420px at 80% 0,rgba(201,164,92,.25),transparent 65%),
   linear-gradient(135deg,#1c2f52,#0e1830 70%)}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:22px}
.top .logo{width:62px}
.cta-top{display:flex;gap:18px;font-size:14px;color:#d8deea}
.cta-top b{color:var(--gold-2);font-weight:600}
nav.main{position:relative;margin-top:14px;border-top:1px solid rgba(255,255,255,.14);display:flex;gap:6px;justify-content:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.main a{padding:12px 22px;text-align:center;white-space:nowrap;font-weight:700;font-size:15px;position:relative}
nav.main a small{display:block;font-weight:400;font-size:11px;color:#a8b3c7;letter-spacing:.5px}
nav.main a::before{content:"";position:absolute;top:-1px;inset-inline:22px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
nav.main a:hover::before,nav.main a:focus-visible::before{transform:scaleX(1)}
.hero-c{position:relative;text-align:center;padding-top:82px;max-width:820px;margin-inline:auto}

.float{position:relative;margin-top:-92px;z-index:2}
.float .box{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-radius:10px;box-shadow:0 24px 60px rgba(16,27,48,.22);overflow:hidden}
.float a{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 12px;color:var(--navy);transition:.25s;border-inline-start:1px solid #eee}
.float a:first-child{border:0}
.float a strong{font-size:15px}
.float a span{font-size:12px;color:var(--muted)}
.float a svg{color:var(--gold-d)}

.float a.on span,.float a:hover span{color:#cdd5e3}
.float a.on svg,.float a:hover svg{color:var(--gold-2)}

/* WHY */
.why{padding:90px 0 80px;text-align:center}
h2.t{margin:0 0 8px;font-size:clamp(24px,3.6vw,34px);font-weight:800;color:var(--navy)}

.tabs::before{content:"";position:absolute;top:10px;inset-inline:calc(50% - 190px);height:2px;background:var(--line)}
.tab{position:relative;background:none;border:0;font:inherit;color:var(--muted);cursor:pointer;padding:30px 6px 0;font-weight:600;min-width:90px}
.tab::before{content:"";position:absolute;top:3px;left:50%;translate:-50% 0;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--line);transition:.2s}
.tab[aria-selected=true]{color:var(--navy)}
.tab[aria-selected=true]::before{border-color:var(--gold);background:var(--gold)}
.why-grid{text-align:center}
.why-text{text-align:center}
.why-text .bar{margin-inline:auto}
.why-text h3{margin:0 0 10px;font-size:22px;color:var(--navy)}
.why-text p{margin:0;color:var(--muted);font-size:16px}
